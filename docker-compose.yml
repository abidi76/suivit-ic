services:
  postgres:
    image: postgres:16-alpine
    container_name: suivitic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: suivitic
      POSTGRES_PASSWORD: suivitic
      POSTGRES_DB: suivitic
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suivitic"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: