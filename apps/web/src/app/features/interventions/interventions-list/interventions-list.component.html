<h2>Liste des Interventions</h2>

<div *ngIf="isLoading">Chargement...</div>

<table *ngIf="!isLoading" style="width: 100%; border-collapse: collapse; margin-top: 15px;">
  <thead>
    <tr style="background: #f4f4f4; text-align: left;">
      <th style="padding: 10px; border: 1px solid #ddd;">Référence</th>
      <th style="padding: 10px; border: 1px solid #ddd;">Statut</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of interventions">
      <td style="padding: 10px; border: 1px solid #ddd;">{{ item.reference }}</td>
      <td style="padding: 10px; border: 1px solid #ddd;">{{ item.statut }}</td>
    </tr>
    <tr *ngIf="interventions.length === 0">
      <td colspan="2" style="padding: 10px; text-align: center; border: 1px solid #ddd;">
        Aucune intervention trouvée.
      </td>
    </tr>
  </tbody>
</table>
